spring:
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: development
    driver-class-name: org.postgresql.Driver
    hikari:
      maximunPoolSize: 30
      connectionTimeout: 10000
      maxLifetime: 600000
      auto-commit: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        integration:
          envers:
            enable: false
    hibernate:
      ddl-auto: none
management:
  health:
    redis:
      enable: false
    db:
      enable: false
    diskSpace:
      enable: false
    ping:
      enable: false
  endpoint:
    health:
      show-detail: always
      probes:
        enable: true
  server:
    port: 8080
  endpoints:
    web:
      base-path: "/"
      exposure:
        include: "*"
      path-mapping:
        metrics: "metric-names"
        prometheus: "metrics"

logging:
  level:
    org.springframework: INFO
    org.hibernate: WARN
    springfox.documentation: WARN
    com.zaxxer.hikari: WARN
    ma.glasnost.orika: WARN